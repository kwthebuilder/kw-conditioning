<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f4f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121315" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Acro S&amp;C" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>Acro Base S&amp;C</title>
    <style>
      :root {
        --bg: #f4f4f0;
        --card: #ffffff;
        --ink: #17191c;
        --muted: #6b7075;
        --line: #e4e4df;
        --accent: #0e7c6b;
        --accent-ink: #ffffff;
        --accent-soft: #e3f3ef;
        --warn: #8a5a00;
        --warn-soft: #fdf1d8;
        --bad: #b3261e;
        --bad-soft: #fbe9e7;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 4px 14px rgba(0, 0, 0, 0.04);
        --radius: 14px;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121315;
          --card: #1c1e21;
          --ink: #ecedee;
          --muted: #9aa0a6;
          --line: #2c2f33;
          --accent: #3fb59f;
          --accent-ink: #0b1512;
          --accent-soft: #16302b;
          --warn: #f2c56b;
          --warn-soft: #3a2d10;
          --bad: #f28b82;
          --bad-soft: #3a1f1d;
          --shadow: none;
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        padding: 14px 16px calc(92px + env(safe-area-inset-bottom));
        max-width: 40rem;
        margin-inline: auto;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 16px;
        line-height: 1.4;
        font-feature-settings: "tnum" 1, "cv11" 1;
        -webkit-font-smoothing: antialiased;
      }
      h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
      h2 { font-size: 17px; font-weight: 650; margin: 0; letter-spacing: -0.005em; }
      p { margin: 0; }
      button, input { font: inherit; color: inherit; }

      /* buttons */
      button {
        min-height: 46px;
        padding: 0 16px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        transition: transform 0.06s ease, background 0.15s ease;
      }
      button:active { transform: scale(0.98); }
      button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
      button.quiet { background: transparent; border-color: transparent; color: var(--accent); padding: 0 8px; min-height: 40px; }
      button.subtle { background: transparent; }

      /* segmented day control */
      .seg { display: inline-flex; background: var(--line); border-radius: 12px; padding: 3px; }
      .seg button { min-height: 40px; border: 0; background: transparent; border-radius: 9px; padding: 0 14px; color: var(--muted); font-weight: 600; }
      .seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }

      /* inputs */
      label.f { display: inline-flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; text-transform: uppercase; }
      label.f.check { flex-direction: row; align-items: center; text-transform: none; font-weight: 500; font-size: 14px; min-height: 46px; gap: 8px; }
      .row > button.primary { flex: 1 1 auto; min-width: 5rem; }
      input[type='number'] {
        width: 5rem;
        min-height: 46px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--bg);
        font-size: 18px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        -moz-appearance: textfield;
      }
      input[type='number']::-webkit-inner-spin-button { -webkit-appearance: none; }
      input[type='number']:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
      input.missing { border-color: var(--bad); background: var(--bad-soft); }
      input[type='checkbox'] { width: 22px; height: 22px; accent-color: var(--accent); }
      input[type='date'] {
        min-height: 40px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); font-size: 14px; font-weight: 600;
      }
      input[type='file'] { font-size: 14px; }

      /* top */
      .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .top .grow { flex: 1; }
      .status { font-size: 12px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
      .status::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
      .status.ok { color: var(--accent); }
      .status.ok::before { background: var(--accent); }
      .context { margin: 14px 0 6px; font-size: 14px; color: var(--muted); display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
      .context strong { color: var(--ink); font-weight: 650; }
      .tms { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 14px; }
      .chip { display: inline-flex; align-items: center; gap: 6px; height: 40px; min-height: 0; line-height: 1; padding: 0 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 14px; font-weight: 500; box-shadow: var(--shadow); }
      .chip b { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
      .chip .pen { color: var(--accent); font-size: 13px; }

      /* cards */
      .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--line); padding: 14px 16px; margin-bottom: 12px; }
      .card .head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
      .card .tag { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--muted); background: var(--bg); border-radius: 999px; padding: 4px 10px; white-space: nowrap; align-self: center; }
      .card .kicker { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
      .item { padding: 12px 0; }
      .item + .item { border-top: 1px solid var(--line); }
      .item .title { display: flex; align-items: baseline; gap: 10px; }
      .item .title h2 { flex: 1; }
      .item .title .tm { font-size: 13px; color: var(--muted); white-space: nowrap; }
      .item .title .tm b { color: var(--ink); font-weight: 650; }
      .rx { display: flex; align-items: baseline; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
      .rx .big { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
      .rx .unit { font-size: 15px; color: var(--muted); font-weight: 500; }
      .rx .sets { font-size: 16px; font-weight: 600; }
      .sub { font-size: 14px; color: var(--muted); margin-top: 2px; }
      .ramp { font-size: 13px; color: var(--muted); margin-top: 6px; }
      .ramp span { display: inline-block; padding: 2px 8px; border-radius: 6px; background: var(--bg); margin-right: 4px; font-variant-numeric: tabular-nums; }
      .row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; margin-top: 12px; }
      .row .spacer { flex: 1; }
      .warm { color: var(--muted); font-size: 15px; font-weight: 500; padding: 10px 0; }

      /* callouts */
      .callout { border-radius: 12px; padding: 10px 12px; margin-top: 8px; font-size: 14px; }
      .callout.warn { background: var(--warn-soft); color: var(--warn); }
      .callout.info { background: var(--accent-soft); color: var(--accent); }
      .callout .row { margin-top: 8px; }
      .callout strong { font-weight: 650; }


      /* frame calculator */
      .calc-wrap { display: contents; }
      .calc { flex-basis: 100%; background: var(--bg); border-radius: 12px; padding: 10px 12px 12px; margin-top: 4px; }
      .calc .row { margin-top: 6px; }
      .calc-out { font-size: 14px; color: var(--muted); margin-top: 8px; }
      .calc-ladder { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
      .calc-height { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
      .calc-label { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; }
      .calc-mean { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
      .calc-pair { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
      .calc-pair label.f { font-size: 11px; }
      .calc-pair input[type='number'] { width: 100%; min-width: 0; min-height: 40px; font-size: 16px; padding: 0 8px; }

      /* plan */
      .plan-now { font-size: 14px; color: var(--muted); margin: 4px 0 10px; }
      .plan-table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
      .plan-table th { text-align: left; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 6px 6px 6px 0; border-bottom: 1px solid var(--line); }
      .plan-table td { padding: 8px 6px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
      .plan-table td:nth-child(3) { white-space: nowrap; }
      .plan-table tr:last-child td { border-bottom: 0; }
      .plan-table tr.now td { background: var(--accent-soft); }
      .plan-table tr.now td:first-child { border-radius: 8px 0 0 8px; padding-left: 6px; }
      .plan-table tr.now td:last-child { border-radius: 0 8px 8px 0; }
      .now-tag { display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.05em; }

      /* alerts */
      .banner { background: var(--bad-soft); color: var(--bad); padding: 10px 14px; border-radius: 12px; margin: 10px 0; font-size: 14px; font-weight: 500; white-space: pre-wrap; }
      .refer { color: var(--bad); font-weight: 600; }

      /* history */
      details.hist { margin-top: 6px; }
      details.hist summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; min-height: 46px; font-weight: 650; }
      details.hist summary::-webkit-details-marker { display: none; }
      details.hist summary::after { content: '›'; color: var(--muted); font-size: 22px; transition: transform 0.15s; }
      details.hist[open] summary::after { transform: rotate(90deg); }
      .hist ul { list-style: none; padding: 0; margin: 4px 0 0; }
      .hist li { padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; display: grid; grid-template-columns: 5.4rem 1fr; gap: 8px; }
      .hist li time { color: var(--muted); font-variant-numeric: tabular-nums; }
      .foot { text-align: center; font-size: 12px; color: var(--muted); margin-top: 18px; }

      /* bottom bar */
      .end {
        position: fixed; left: 0; right: 0; bottom: 0;
        padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        border-top: 1px solid var(--line);
        display: flex; justify-content: center;
      }
      .end button { width: 100%; max-width: 40rem; min-height: 52px; font-size: 17px; border-radius: 14px; }

      /* panel */
      .panel { position: fixed; inset: 0; background: var(--bg); padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); overflow: auto; z-index: 10; }
      .panel .card { margin-bottom: 14px; }
      .panel h2 { margin-bottom: 6px; }
      .panel p { font-size: 15px; color: var(--muted); margin-bottom: 10px; }
      .panel .ok { color: var(--accent); font-weight: 600; }

      /* ---- interface v1.0 (ui_spec_v1_0.md) ---- */
      .pill { font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
      .pill.ok { color: var(--accent); border-color: transparent; background: var(--accent-soft); }
      .pill.wait { color: var(--warn); border-color: transparent; background: var(--warn-soft); }
      .datebar { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
      .datebar input[type='date'] { flex: 1; min-width: 0; min-height: 46px; font-size: 16px; }
      .datebar .nav { min-width: 46px; padding: 0; font-size: 24px; line-height: 1; }
      .datebar .today { padding: 0 14px; color: var(--accent); }
      .dayrow { display: flex; margin-top: 8px; min-height: 8px; }
      .dayrow .seg { width: 100%; }
      .dayrow .seg button { flex: 1; min-height: 44px; }
      .day-fixed { font-weight: 650; font-size: 15px; padding: 6px 0 0; }
      .context { display: flex; flex-direction: column; gap: 2px; margin: 12px 0 4px; }
      .context strong { font-size: 17px; }
      .context .muted { font-size: 13px; }
      .muted { color: var(--muted); }
      .tms { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 8px 0 12px; }
      .tms .chip { height: auto; min-height: 56px; padding: 8px 12px; border-radius: 14px; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; }
      .tms .chip .lab { text-transform: none; letter-spacing: 0; font-size: 12px; font-weight: 600; }
      .tms .chip b { font-size: 18px; }
      .steps { margin: 6px 0 0; padding-left: 18px; font-size: 14px; color: var(--muted); }
      .steps li { margin: 4px 0; }
      .mode { margin: 4px 0 12px; padding: 10px 14px; border-radius: 12px; font-size: 14px; font-weight: 500; background: var(--card); border: 1px solid var(--line); color: var(--muted); }
      .mode.record { background: var(--bg); }
      .mode.edit { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
      .mode.preview { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
      .mode.warn { background: var(--bad-soft); color: var(--bad); border-color: transparent; }

      .item .title .meta { font-size: 13px; color: var(--muted); white-space: nowrap; }
      .item.compact { padding: 8px 0; }
      .status { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; letter-spacing: 0.01em; }
      .status.ok { background: var(--accent-soft); color: var(--accent); }
      .status.skip { background: var(--bg); color: var(--muted); }
      .status.none { background: transparent; color: var(--muted); border: 1px dashed var(--line); }
      .status.pending { background: var(--warn-soft); color: var(--warn); }
      .did { font-size: 16px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
      .outcome { font-size: 14px; color: var(--accent); margin-top: 2px; }
      .skipped .did { color: var(--muted); }
      .last { font-size: 13px; color: var(--muted); margin-top: 6px; }
      .planned { font-size: 15px; color: var(--ink); margin-top: 2px; }
      .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
      .tags:empty { display: none; }
      .tag { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--bg); border-radius: 999px; padding: 3px 9px; }
      .tag.warn { background: var(--warn-soft); color: var(--warn); }
      .tags .tag { margin-left: 0; }
      .row.tight .quiet { padding-left: 0; }
      .row.tight { margin-top: 6px; gap: 6px; }
      .row.actions { margin-top: 12px; }
      .row.actions > button { flex: 1 1 auto; }
      .row.actions > button.primary { flex: 2 1 auto; }
      button.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
      button.danger-text { color: var(--bad); }
      .item.editing { background: var(--bg); margin: 0 -10px; padding: 12px 10px; border-radius: 12px; }

      /* record */
      .rec-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; font-size: 14px; font-weight: 600; margin: 0 2px 10px; }
      .rec-head .muted { font-weight: 500; }
      .pvd { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 6px; }
      .pvd > div { display: flex; flex-direction: column; gap: 2px; font-size: 15px; font-variant-numeric: tabular-nums; }
      .pvd .lab, .lab { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
      .rec.st-not_logged h2 { color: var(--muted); font-weight: 600; }
      .pending-text { font-size: 14px; color: var(--warn); margin-top: 6px; font-weight: 600; }
      .card.empty h2 { margin-bottom: 4px; }

      /* inputs */
      .fields { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
      .stepper { display: flex; flex-direction: column; gap: 4px; }
      .stepper .ctl { display: flex; align-items: stretch; gap: 6px; }
      .stepper .ctl input[type='number'] { flex: 1; min-width: 0; width: auto; text-align: center; font-size: 22px; min-height: 52px; }
      .stepper button.step { min-width: 56px; min-height: 52px; padding: 0; font-size: 26px; font-weight: 500; line-height: 1; }
      .stepper .u { font-size: 12px; color: var(--muted); }
      .choice-wrap { display: flex; flex-direction: column; gap: 4px; }
      .choices { display: flex; gap: 6px; flex-wrap: wrap; border-radius: 12px; }
      .choices button { flex: 1 1 0; min-width: 52px; min-height: 50px; padding: 0 8px; font-size: 17px; }
      .choices button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
      .choices.missing { outline: 2px solid var(--bad); outline-offset: 2px; }
      label.check { display: flex; align-items: center; gap: 10px; min-height: 46px; font-size: 15px; font-weight: 500; }
      .err { color: var(--bad); font-size: 14px; font-weight: 600; margin-top: 8px; }
      .skip-reasons { margin-top: 10px; padding: 10px; border-radius: 12px; background: var(--bg); display: flex; flex-direction: column; gap: 8px; }
      .skip-reasons .choices button { flex: 1 1 30%; font-size: 15px; min-height: 46px; }
      label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
      input[type='text'], input[type='password'] { min-height: 46px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); font-size: 16px; }

      /* bottom bar with two buttons */
      .end.two { gap: 10px; }
      .end.two button { flex: 1; }
      .end.two button.primary { flex: 2; }

      /* toast */
      .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 30; display: flex; align-items: center; gap: 14px; max-width: calc(100% - 32px); padding: 8px 8px 8px 16px; border-radius: 14px; background: var(--ink); color: var(--bg); font-size: 15px; font-weight: 500; box-shadow: 0 6px 24px rgba(0,0,0,0.18); }
      .toast span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .toast button { min-height: 40px; flex: none; background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 40%, transparent); }

      /* sheets */
      .sheet-wrap { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,0.38); display: flex; align-items: flex-end; justify-content: center; }
      .sheet { width: 100%; max-width: 40rem; max-height: 88vh; overflow: auto; background: var(--card); border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; }
      .sheet h3 { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 10px 0 0; }
      .sheet .list { margin: 0; padding-left: 18px; font-size: 15px; }
      .sheet .list li { margin: 4px 0; }
      .sheet .hist-list { list-style: none; padding: 0; font-size: 14px; }
      .sheet .hist-list time { color: var(--muted); }

      /* recent and plan */
      .recent li { display: block; padding: 0; }
      .recent button { width: 100%; display: flex; justify-content: space-between; gap: 10px; align-items: center; border: 0; border-radius: 10px; background: transparent; padding: 0 6px; min-height: 48px; font-weight: 500; text-align: left; }
      .recent button.on { background: var(--accent-soft); }
      .recent .d { font-weight: 650; white-space: nowrap; }
      .recent .muted { font-size: 13px; text-align: right; }
      .hist ul.recent li, .hist ul.blocks li, .hist ul.raw li { grid-template-columns: none; }
      .blocks li { display: flex !important; gap: 10px; align-items: baseline; }
      .blocks .d { color: var(--muted); width: 3.6rem; flex: none; font-variant-numeric: tabular-nums; }
      .blocks li.now { font-weight: 650; }
      .raw li { display: grid !important; grid-template-columns: 3.4rem 1fr !important; }
    </style>
  </head>
  <body>
    <main id="app"><p>Loading…</p></main>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
