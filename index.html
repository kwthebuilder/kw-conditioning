<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1b1b1b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Acro S&amp;C" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>Acro Base S&amp;C</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 18px;
        line-height: 1.35;
        --line: #8884;
        --ok: #1d8f3a;
        --bad: #b00020;
        --muted: #777;
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 12px 12px 96px; max-width: 42rem; }
      h1 { font-size: 1.15rem; margin: 0; }
      h2 { font-size: 1rem; margin: 0; font-weight: 700; }
      button, input, select { font: inherit; }
      button { min-height: 48px; min-width: 48px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: #8881; }
      button.primary { background: #1b1b1b; color: #fff; border-color: #1b1b1b; }
      button.on { background: #1b1b1b; color: #fff; }
      button.ghost { border-color: transparent; background: none; padding: 0 6px; min-height: 36px; }
      input[type='number'], input[type='date'] { min-height: 48px; width: 6rem; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; }
      input:invalid, input.missing { border-color: var(--bad); }
      label.f { display: inline-flex; flex-direction: column; font-size: 0.8rem; color: var(--muted); gap: 2px; }
      .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
      .grow { flex: 1; }
      .dot { font-size: 0.8rem; color: var(--muted); }
      .dot.ok { color: var(--ok); }
      .tm { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
      .block { padding: 8px 0; border-bottom: 1px solid var(--line); }
      .block .tag { font-size: 0.8rem; color: var(--muted); }
      .item { padding: 6px 0; }
      .item + .item { border-top: 1px dashed var(--line); }
      .row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px; margin-top: 6px; }
      .note { font-size: 0.85rem; color: var(--muted); margin: 2px 0; }
      .warmup { color: var(--muted); }
      .done { color: var(--ok); }
      .done .sum { color: inherit; font-size: 0.9rem; }
      .steps { font-size: 0.85rem; margin: 4px 0 0; padding-left: 1rem; }
      .banner { background: #b0002018; color: var(--bad); padding: 8px 10px; border-radius: 8px; margin: 8px 0; white-space: pre-wrap; }
      .end { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: Canvas; border-top: 1px solid var(--line); display: flex; gap: 8px; }
      .end button { flex: 1; }
      .panel { position: fixed; inset: 0; background: Canvas; padding: 16px 12px; overflow: auto; z-index: 10; }
      .panel h2 { margin-bottom: 8px; }
      .panel p { margin: 6px 0; }
      details { margin-top: 12px; }
      summary { min-height: 48px; display: flex; align-items: center; cursor: pointer; }
      .hist { list-style: none; padding: 0; margin: 0; font-size: 0.9rem; }
      .hist li { padding: 6px 0; border-top: 1px dashed var(--line); }
      .refer { color: var(--bad); }
      @media (prefers-color-scheme: dark) {
        button.primary, button.on { background: #eee; color: #111; border-color: #eee; }
      }
    </style>
  </head>
  <body>
    <main id="app"><p>Loading…</p></main>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
